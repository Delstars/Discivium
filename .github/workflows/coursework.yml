name: Coursework verification
on:
  push:
    branches: [main, integrate-tested-prototype]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest prototype.tests prototype.campus_tests -v
      - run: sudo apt-get update && sudo apt-get install -y plantuml graphviz libpango-1.0-0 libpangoft2-1.0-0
      - run: python -m pip install markdown weasyprint
      - run: python docs/export.py
      - uses: actions/upload-artifact@v4
        with:
          name: Discivium-submission-drafts
          path: docs/output/*.pdf
